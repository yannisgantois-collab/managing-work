<div id="wrap"><div id="stage"></div><div id="ui"></div></div>
<script type="module">
import * as L from './lib.js';
import { SETS, CAMS } from './scenes.js';
const q = new URLSearchParams(location.search);
const W = +(q.get('w') || 720), H = Math.round(W * 16 / 9), id = q.get('shot') || 'P01', ui = q.get('ui') !== '0';
document.documentElement.style.setProperty('--w', W + 'px'); document.documentElement.style.setProperty('--h', H + 'px');
document.documentElement.style.setProperty('--u', (W / 1080) + 'px');
const nb = (s) => s.replace(/ ([?!:;»])/g, ' $1').replace(/« /g, '« ').replace(/(\d) (\d{3})/g, '$1 $2');
try {
  await Promise.all(['500 64px Newsreader', '600 64px Newsreader', 'italic 500 64px Newsreader', 'italic 600 64px Newsreader', '600 64px Inter', '700 64px Inter', '800 64px Inter', '500 30px "IBM Plex Mono"', '600 30px "IBM Plex Mono"'].map(f => document.fonts.load(f)));
  const data = await (await fetch('./shots.json')).json();
  const shot = data.shots.find(s => s.id === id);
  if (shot.set !== 'endcard') {
    const [fov, pos, look, fin] = CAMS[shot.set + ':' + shot.cam];
    const { renderer, scene } = L.makeStage({ W, H, env: 0.3 });
    L.seed(7);
    SETS[shot.set](scene, { variant: shot.cam });
    const camera = L.cam(W, H, fov, pos, look, fin.up);
    const comp = L.finish({ renderer, scene, camera, W, H, ...fin });
    comp.render();
  }
  if (ui) {
    const u = document.getElementById('ui'); let h = '';
    if (shot.set === 'endcard') {
      h += `<div class="end"><h1>${nb(data.title)}</h1><div class="mono">${shot.end.mono.map(nb).join('<br>')}</div>
        <svg viewBox="0 0 64 56" fill="none"><path d="M36 4 L60 24 L36 44 V32 C20 32 10 37 3 50 C5 30 15 18 36 16 Z" fill="#fff"/></svg>
        <div class="cta">${shot.end.cta.map(nb).join('<br>')}</div><div class="handle"><i></i>${data.handle}</div></div>`;
    } else {
      if (shot.cap) h += `<div class="capbg"></div>`;
      if (shot.title) h += `<div class="title">${nb(data.title)}</div>`;
      if (shot.hud) {
        h += `<div class="hud"><div class="lab">${shot.hud.label}</div><div class="val">${nb(shot.hud.value)}</div><div class="tl">${shot.hud.tl}</div>`;
        if (shot.hud.sub) h += `<div class="sub">${shot.hud.sub[0]}<b>${nb(shot.hud.sub[1])}</b></div>`;
        h += `</div>`;
      }
      if (shot.cap) h += `<div class="cap"><span>${nb(shot.cap)}</span></div>`;
    }
    u.innerHTML = h;
  }
  await new Promise(r => requestAnimationFrame(() => requestAnimationFrame(r)));
  document.title = 'done';
} catch (e) { console.log('ERR ' + e.message + '\n' + e.stack); document.title = 'done-error'; }
</script>
